services:
  vigilnode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vigilnode-portal
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-this-strong-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      DB_PATH: /app/data/vigilnode.db
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      PROBE_CONCURRENCY_LIMIT: ${PROBE_CONCURRENCY_LIMIT:-10}
      GMAIL_SMTP_HOST: ${GMAIL_SMTP_HOST:-smtp.gmail.com}
      GMAIL_SMTP_PORT: ${GMAIL_SMTP_PORT:-587}
      GMAIL_SMTP_USER: ${GMAIL_SMTP_USER:-}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - vigilnode_data:/app/data
    restart: unless-stopped

volumes:
  vigilnode_data:
    driver: local